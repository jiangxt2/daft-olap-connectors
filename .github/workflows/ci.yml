name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      candidate_sha:
        description: Immutable release candidate commit to test
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.candidate_sha || 'direct' }}
  cancel-in-progress: true

jobs:
  static:
    name: Static and package checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - run: uv run ruff check src tests scripts benchmarks
      - run: uv run ruff format --check src tests scripts benchmarks
      - run: uv run mypy src tests/unit tests/contract
      - run: uv run python scripts/check_license_headers.py
      - run: >-
          uv run python scripts/check_workflow_pins.py
          .github/workflows/ci.yml .github/workflows/release.yml
      - run: >-
          uv run python scripts/check_release_workflow.py
          .github/workflows/ci.yml .github/workflows/release.yml
      - run: uv run codespell
      - run: uv run mkdocs build --strict
      - if: inputs.candidate_sha == ''
        run: uv run python -m build

  contract:
    name: ${{ matrix.profile }} / Python ${{ matrix.python }} / Daft ${{ matrix.daft }} / Ray ${{ matrix.ray }} / PyArrow ${{ matrix.pyarrow }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: minimum-pyarrow
            python: "3.12"
            daft: "0.7.23"
            pyarrow: "16.1.0"
            ray: "2.55.1"
            ray_requirement: "ray==2.55.1"
          - profile: tributo
            python: "3.12"
            daft: "0.7.23"
            pyarrow: "19.0.1"
            ray: "2.55.1"
            ray_requirement: "ray[default,serve,tune]==2.55.1"
          - profile: tributo
            python: "3.13"
            daft: "0.7.23"
            pyarrow: "19.0.1"
            ray: "2.55.1"
            ray_requirement: "ray[default,serve,tune]==2.55.1"
          - profile: upper-pyarrow
            python: "3.13"
            daft: "0.7.23"
            pyarrow: "24.0.0"
            ray: "2.55.1"
            ray_requirement: "ray==2.55.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras --group dev
      - run: >-
          uv pip install
          "daft[ray]==${{ matrix.daft }}"
          "${{ matrix.ray_requirement }}"
          "pyarrow==${{ matrix.pyarrow }}"
      - run: >-
          uv run --no-sync pytest -p no:cacheprovider tests/unit tests/contract
          -m "not ray" --cov=daft_olap --cov-branch --cov-report=term-missing
      - run: uv run --no-sync pytest -p no:cacheprovider tests/contract -m ray -vv

  clickhouse-it:
    name: ClickHouse 25.3.2.39 IT
    needs: [static, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - run: ./scripts/run_clickhouse_it.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: clickhouse-it-logs
          path: .artifacts/it
          if-no-files-found: ignore

  doris-it:
    name: Doris 4.0.6 IT
    needs: [static, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - run: ./scripts/run_doris_it.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doris-it-logs
          path: .artifacts/it
          if-no-files-found: ignore
