name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full master-reachable commit SHA to validate without publishing
        required: true
        type: string
      expected_version:
        description: Exact package version expected at candidate_sha
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref || inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.candidate.outputs.mode }}
      sha: ${{ steps.candidate.outputs.sha }}
      version: ${{ steps.candidate.outputs.version }}
      tag: ${{ steps.candidate.outputs.tag }}
      master_sha: ${{ steps.candidate.outputs.master_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: master
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch protected master identity
        run: >-
          git fetch --force origin
          +refs/heads/master:refs/remotes/origin/master
          +refs/tags/*:refs/tags/*
      - name: Resolve immutable candidate
        id: candidate
        env:
          CANDIDATE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.ref }}
          EXPECTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version || '' }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'dry-run' || 'tag' }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          EVENT_SHA: ${{ github.event_name == 'push' && github.event.after || '' }}
          EVENT_CREATED: ${{ github.event_name == 'push' && github.event.created || false }}
          EVENT_DELETED: ${{ github.event_name == 'push' && github.event.deleted || false }}
          EVENT_FORCED: ${{ github.event_name == 'push' && github.event.forced || false }}
        run: >-
          python scripts/validate_release_candidate.py
          --mode "${MODE}"
          --candidate-ref "${CANDIDATE_REF}"
          --expected-version "${EXPECTED_VERSION}"
          --tag "${RELEASE_TAG}"
          --master-ref origin/master
          --event-sha "${EVENT_SHA}"
          --event-created "${EVENT_CREATED}"
          --event-deleted "${EVENT_DELETED}"
          --event-forced "${EVENT_FORCED}"
          --github-output "${GITHUB_OUTPUT}"

  gates:
    name: Candidate CI gates
    needs: candidate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.candidate.outputs.sha }}

  build:
    name: Build and scan distributions
    needs: [candidate, gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      distributions_artifact_id: ${{ steps.upload-distributions.outputs.artifact-id }}
      distributions_artifact_digest: ${{ steps.upload-distributions.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --locked --all-extras --group dev
      - name: Scan candidate for credentials
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ""
          head: ${{ needs.candidate.outputs.sha }}
          extra_args: --results=verified,unknown
      - name: Build distributions once
        run: uv run python -m build --outdir release-artifacts/packages
      - name: Validate distribution metadata
        run: uvx twine check release-artifacts/packages/*
      - name: Create and verify distribution manifest
        run: >-
          uv run python scripts/verify_release_artifacts.py release-artifacts/packages
          --name daft-olap-connectors
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release-artifacts/SHA256SUMS
          --prepare
      - name: Generate distribution SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: release-artifacts/packages/
          format: spdx-json
          output-file: daft-olap-connectors-sbom.spdx.json
          artifact-name: sbom
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: daft-olap-connectors-sbom.spdx.json
          if-no-files-found: error
      - name: Upload distributions
        id: upload-distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: release-artifacts/
          if-no-files-found: error
      - name: Record distribution artifact identity
        env:
          ARTIFACT_ID: ${{ steps.upload-distributions.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-distributions.outputs.artifact-digest }}
        run: |
          test -n "${ARTIFACT_ID}"
          [[ "${ARTIFACT_DIGEST}" =~ ^[0-9a-f]{64}$ ]]
          {
            echo "### Distribution artifact"
            echo
            echo "- ID: \`${ARTIFACT_ID}\`"
            echo "- SHA-256: \`${ARTIFACT_DIGEST}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  install-smoke:
    name: Install ${{ matrix.profile }}
    needs: [candidate, gates, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: base
            extra: ""
          - profile: clickhouse
            extra: "[clickhouse]"
          - profile: doris
            extra: "[doris]"
          - profile: doris-flight
            extra: "[doris-flight]"
          - profile: ray
            extra: "[ray]"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - name: Verify downloaded distributions
        run: >-
          python scripts/verify_release_artifacts.py release/packages
          --name daft-olap-connectors
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - name: Install built distribution
        env:
          EXTRA: ${{ matrix.extra }}
        run: |
          wheel="$(find release/packages -maxdepth 1 -type f -name '*.whl')"
          test -n "${wheel}"
          python -m pip install "daft-olap-connectors${EXTRA} @ file://${GITHUB_WORKSPACE}/${wheel}"
      - name: Import installation profile
        run: >-
          python scripts/check_install_profile.py "${{ matrix.profile }}"
          --version "${{ needs.candidate.outputs.version }}"

  publish:
    name: Publish to PyPI
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.candidate.result == 'success' &&
      needs.gates.result == 'success' &&
      needs.build.result == 'success' &&
      needs.install-smoke.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, gates, build, install-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - name: Revalidate live release tag
        run: >-
          python scripts/verify_release_tag.py
          --tag "${{ needs.candidate.outputs.tag }}"
          --expected-sha "${{ needs.candidate.outputs.sha }}"
      - name: Revalidate distribution identity and manifest
        run: >-
          python scripts/verify_release_artifacts.py release/packages
          --name daft-olap-connectors
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: false
          packages-dir: release/packages/

  github-release:
    name: Create GitHub Release
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.candidate.result == 'success' &&
      needs.gates.result == 'success' &&
      needs.build.result == 'success' &&
      needs.install-smoke.result == 'success' &&
      needs.publish.result == 'success' &&
      needs.candidate.outputs.mode == 'tag'
    needs: [candidate, gates, build, install-smoke, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.distributions_artifact_id }}
          path: release/
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/
      - name: Revalidate live release tag
        run: >-
          python scripts/verify_release_tag.py
          --tag "${{ needs.candidate.outputs.tag }}"
          --expected-sha "${{ needs.candidate.outputs.sha }}"
      - name: Revalidate distribution identity and manifest
        run: >-
          python scripts/verify_release_artifacts.py release/packages
          --name daft-olap-connectors
          --version "${{ needs.candidate.outputs.version }}"
          --manifest release/SHA256SUMS
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ needs.candidate.outputs.tag }}"
          release/packages/* release/SHA256SUMS sbom/*
          --verify-tag --generate-notes --title "${{ needs.candidate.outputs.tag }}"
