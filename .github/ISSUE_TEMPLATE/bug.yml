name: Bug report
description: Report a reproducible connector defect without credentials or private data.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: connector
    attributes:
      label: Connector and transport
      options:
        - ClickHouse
        - Doris MySQL
        - Doris Flight SQL
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Include Python, Daft, PyArrow, driver, and database versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Redact credentials, hosts, SQL literals, and business data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
