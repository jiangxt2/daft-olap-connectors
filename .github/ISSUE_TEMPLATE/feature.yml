name: Feature proposal
description: Propose a connector capability or an upstream-aligned API change.
title: "[Proposal] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user-visible limitation, not only a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Proposed contract
      description: Include semantics, fallback behavior, resource bounds, and failure behavior.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Compatibility and test evidence
      description: Name the relevant Daft and database APIs plus proposed real-infrastructure tests.
    validations:
      required: true
