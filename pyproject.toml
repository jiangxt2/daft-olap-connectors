[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "daft-olap-connectors"
version = "0.1.0a1"
description = "Daft DataSource connectors for ClickHouse and Apache Doris"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
authors = [{ name = "daft-olap-connectors contributors" }]
keywords = ["apache-doris", "clickhouse", "daft", "olap", "pyarrow"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "daft>=0.7.23,<0.7.24",
  "pyarrow>=16,<25",
]

[project.optional-dependencies]
clickhouse = ["clickhouse-connect[arrow,async]>=1.0.1,<1.6"]
doris = ["PyMySQL>=1.2,<1.3"]
doris-flight = [
  "PyMySQL>=1.2,<1.3",
  "adbc-driver-manager>=1.6,<2",
  "adbc-driver-flightsql>=1.6,<2",
]
ray = ["daft[ray]>=0.7.23,<0.7.24"]
all = [
  "clickhouse-connect[arrow,async]>=1.0.1,<1.6",
  "PyMySQL>=1.2,<1.3",
  "adbc-driver-manager>=1.6,<2",
  "adbc-driver-flightsql>=1.6,<2",
  "daft[ray]>=0.7.23,<0.7.24",
]

[project.urls]
Documentation = "https://github.com/jiangxt2/daft-olap-connectors#readme"
Issues = "https://github.com/jiangxt2/daft-olap-connectors/issues"
Repository = "https://github.com/jiangxt2/daft-olap-connectors"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "codespell>=2.4,<3",
  "daft[ray]==0.7.23",
  "mypy>=1.15,<2",
  "mkdocs-material>=9.6,<10",
  "pre-commit>=4.2,<5",
  "pyarrow==19.0.1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ray==2.55.1",
  "ruff>=0.11,<1",
  "types-PyMySQL>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/daft_olap"]

[tool.hatch.build.targets.sdist]
exclude = ["/AGENTS.md"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "auto"
filterwarnings = ["error"]
testpaths = ["tests"]
markers = [
  "integration: requires a real database",
  "ray: exercises Daft's Ray runner",
]

[tool.coverage.run]
branch = true
source = ["daft_olap"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PL", "RUF", "S", "SIM", "UP", "W"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/scan.py" = ["PLC0415", "S608"]
"src/daft_olap/clickhouse/api.py" = ["A002"]
"src/daft_olap/clickhouse/discovery.py" = ["PLC0415", "S608"]
"src/daft_olap/clickhouse/schema.py" = ["PERF203", "PLR0911", "PLR0912"]
"src/daft_olap/clickhouse/sql.py" = ["S608"]
"src/daft_olap/clickhouse/transport.py" = ["PLC0415"]
"src/daft_olap/doris/api.py" = ["A002"]
"src/daft_olap/doris/discovery.py" = ["PLC0415", "S310"]
"src/daft_olap/doris/sql.py" = ["S608"]
"src/daft_olap/doris/transports/flight.py" = ["PLC0415"]
"scripts/wait_for_service.py" = ["PLC0415", "S310"]
"tests/**/*.py" = ["PLR2004", "S101", "S105", "S106", "S301", "S603"]

[tool.codespell]
skip = "*.lock,.git,.venv,site"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests/unit", "tests/contract"]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
