name: daft-olap-it-clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.2.39
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-28123}:8123"
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: connector
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-daft-olap-test}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client --user connector --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1"
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - clickhouse-data:/var/lib/clickhouse

volumes:
  clickhouse-data:
